# Run with `dart run ffigen --config ffigen.yaml`.
name: Asn1PluginBindings
description: |
  Bindings for `src/asn1_plugin.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/asn1_plugin_bindings_generated.dart'
headers:
  entry-points:
    - 'src/asn1_plugin.h'
  include-directives:
    - 'src/asn1_plugin.h'
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
comments:
  style: any
  length: full
