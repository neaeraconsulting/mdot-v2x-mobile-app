name: Build & Package Linux .deb

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

defaults:
  run:
    working-directory: cv_mec

jobs:
  package-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-alsa \
            libsecret-1-dev

      - name: Create .env from secrets
        run: |
          set -euo pipefail
          cat > .env <<'EOF'
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          SOME_KEY=${{ secrets.SOME_KEY }}
          # add whatever your app expects
          ## Token for the NOAA Geomagnetic Offset API. Currently all tokens use the value zNEwZ. Users do not need to change this parameter.
          NOAA_GEOMAG_API_TOKEN=${{ secrets.NOAA_GEOMAG_API_TOKEN }}

          MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}

          USERNAME=${{ secrets.USERNAME }}
          PASSWORD=${{ secrets.PASSWORD }}
          API_ENDPOINT=${{ secrets.API_ENDPOINT }}
          VENDOR_ID=${{ secrets.VENDOR_ID }}

          REGISTRATION_LATITUDE=${{ secrets.REGISTRATION_LATITUDE }}
          REGISTRATION_LONGITUDE=${{ secrets.REGISTRATION_LONGITUDE }}

          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
          S3_REGION=${{ secrets.S3_REGION }}
          S3_DESTINATION=${{ secrets.S3_DESTINATION }}


          ## If using a PC5 MQTT broker, the MQTT Broker may be manually specified here. This will automatically enable PC5 in the app.
          # Leave empty, if PC5 will not be used by default
          # PC5_MQTT_BROKER=mqtt://167.20.208.79:1883

          GPS_USERNAME=${{ secrets.GPS_USERNAME }}
          GPS_PASSWORD=${{ secrets.GPS_PASSWORD }}
          GPS_IP=${{ secrets.GPS_IP }}
          EOF

      - name: Verify .env included
        run: |
          test -f .env

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build CV-MEC for Linux
        run: flutter build linux

      - name: Activate Fastforge
        run: dart pub global activate fastforge

      - name: Package Debian .deb
        run: fastforge package --platform linux --targets deb

      - name: Verify .deb exists
        run: ls -R dist || (echo "No dist dir" && exit 1)

      - name: Publish Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          name: ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: cv_mec/dist/**/*.deb
          fail_on_unmatched_files: true
